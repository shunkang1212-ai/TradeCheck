name: 功能建议
description: 建议一个有明确使用场景的改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述业务场景，不要提交真实商业资料。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 如何验收
      description: 请给出可观察的输入和预期结果。
    validations:
      required: true

