name: 缺陷报告
description: 报告可复现的错误或错误结论
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请勿上传真实客户资料、订单、价格、银行信息或其他机密内容。
  - type: input
    id: version
    attributes:
      label: TradeCheck 版本
      placeholder: 例如 0.1.1
    validations:
      required: true
  - type: dropdown
    id: template
    attributes:
      label: 模板
      options: ["A（英文表头）", "B（中文表头）", "其他/无法识别"]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请使用虚构或彻底脱敏的数据说明。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

