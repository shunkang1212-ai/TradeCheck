[metadata]
name = tradecheck-local
version = 0.1.1
description = Local-first consistency checker for commercial invoices and packing lists
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
url = https://github.com/shunkang1212-ai/TradeCheck
project_urls =
    Source = https://github.com/shunkang1212-ai/TradeCheck
    Issues = https://github.com/shunkang1212-ai/TradeCheck/issues

[options]
packages = find:
python_requires = >=3.9
install_requires =
    openpyxl>=3.1,<4
include_package_data = True

[options.packages.find]
include = tradecheck*

[options.package_data]
tradecheck =
    config/*.json
    web/*.html

[options.entry_points]
console_scripts =
    tradecheck = tradecheck.cli:main
